<!DOCTYPE html>
<html lang="nb">
<head>
<meta charset="utf-8">
<title>Nyhetskloden – widget</title>
<style>
:root{color-scheme:dark;--bg:#0b131d;--ink:#e6edf3;--muted:#93a4b3;--dim:#64768a;--line:#1c2b3a;--panel2:#111e2a}
html[data-theme=light]{color-scheme:light;--bg:#fff;--ink:#122033;--muted:#4f6276;--dim:#6f8094;--line:#d5dee8;--panel2:#f3f6f9}
html[data-theme=contrast]{--bg:#000;--ink:#fff;--muted:#e6e6e6;--dim:#cfcfcf;--line:#9a9a9a;--panel2:#111}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:13px/1.35 "Segoe UI Variable Text","Segoe UI",system-ui,sans-serif;overflow:hidden}
body{display:flex;flex-direction:column;border:1px solid var(--line)}
header{display:flex;align-items:center;gap:6px;padding:6px 6px 6px 12px;-webkit-app-region:drag;user-select:none;border-bottom:1px solid var(--line)}
header b{font-weight:600;font-size:12.5px;flex:1}
header button{-webkit-app-region:no-drag;width:26px;height:24px;border:0;border-radius:6px;background:transparent;color:var(--muted);cursor:pointer;font-size:14px}
header button:hover{background:var(--panel2);color:var(--ink)}
header button[aria-pressed=true]{color:#ffb38a}
.wx{display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid var(--line)}
.wx b{font-size:20px;font-weight:600;font-variant-numeric:tabular-nums}
.wx span{color:var(--muted)}
.warm{color:#ff7a6b}.cold{color:#6db3ff}
ol{list-style:none;margin:0;padding:4px;flex:1;overflow:auto}
li button{width:100%;text-align:left;border:0;background:transparent;color:var(--ink);font:inherit;padding:7px 8px;border-radius:8px;cursor:pointer;display:grid;gap:2px}
li button:hover{background:var(--panel2)}
li small{color:var(--dim);font-size:11.5px}
.empty{color:var(--muted);padding:12px}
footer{padding:4px 12px 6px;color:var(--dim);font-size:11px}
.sec>div{display:flex;align-items:baseline;gap:8px;padding:6px 12px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
.sec>div>span:first-child{color:var(--muted);font-size:11.5px;min-width:62px}
.sec>div b{font-weight:600}
.up{color:#3ddc84}.dn{color:#ff6b6b}
html[data-theme=light] .up{color:#15803d}html[data-theme=light] .dn{color:#c62828}
</style>
</head>
<body>
<header><b>Nyhetskloden</b><button id="pin" title="Alltid øverst" aria-pressed="false">📌</button><button id="x" title="Lukk widgeten" aria-label="Lukk">×</button></header>
<div class="wx" id="wx" hidden></div>
<div class="sec" id="extra"></div>
<ol id="top"><li class="empty">Henter saker …</li></ol>
<footer id="foot"></footer>
<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
try{const l=JSON.parse(localStorage.getItem('nk-look')||'{}');const t=l.theme==='system'?(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'):(l.theme||'dark');document.documentElement.dataset.theme=t}catch(e){}
const tfmt=new Intl.DateTimeFormat('nb-NO',{hour:'2-digit',minute:'2-digit'});
const deg=t=>{if(t==null)return'–';const r=Math.round(t)||0;return(r<0?'−':'')+Math.abs(r)+'°'};
const WXT=c=>{c=(c||'').replace(/_(day|night|polartwilight)$/,'');return({clearsky:'Klarvær',fair:'Lettskyet',partlycloudy:'Delvis skyet',cloudy:'Skyet',fog:'Tåke'})[c]||(/snow/.test(c)?'Snø':/sleet/.test(c)?'Sludd':/rain/.test(c)?'Regn':/thunder/.test(c)?'Torden':'')};
const nf0=new Intl.NumberFormat('nb-NO',{maximumFractionDigits:0}),pct=v=>v==null?'–':(v>0?'+':v<0?'−':'±')+Math.abs(v).toFixed(1).replace('.',',')+' %',cls=v=>v>0?'up':v<0?'dn':'';
const row=(k,v)=>`<div><span>${esc(k)}</span>${v}</div>`;
async function load(){
  let s={};try{s=await (await fetch('/api/settings')).json()}catch(e){}
  $('pin').setAttribute('aria-pressed',!!s.widgetOnTop);
  // hva som vises velges under Innstillinger → Generelt
  const show=new Set(Array.isArray(s.widgetShow)?s.widgetShow:['weather','top']);
  $('wx').hidden=true;
  if(show.has('weather')&&s.features&&s.features.weather&&s.home){try{const w=await (await fetch('/api/weather')).json();
      if(w&&w.now){$('wx').hidden=false;$('wx').innerHTML=`<b class="${Math.round(w.now.temp)>0?'warm':'cold'}">${deg(w.now.temp)}</b><span>${esc(WXT(w.now.sym))}, ${esc(s.home.name)}</span>`}}catch(e){}}
  let h='';
  if(show.has('power')){try{const p=await (await fetch('/api/power')).json(),zs=(p.zones||[]).filter(z=>z.now!=null);const mine=zs.find(z=>z.id===(s.powerZone||''))||zs[0];
    if(mine)h+=row('Strøm',`<b>${mine.now.toFixed(2).replace('.',',')} kr</b><small>${esc(mine.name)}, snitt ${mine.avg.toFixed(2).replace('.',',')}</small>`)}catch(e){}}
  if(show.has('portfolio')&&(s.trades||[]).length){try{const p=await (await fetch('/api/portfolio')).json();if(p.value)h+=row('Portefølje',`<b>${nf0.format(Math.round(p.value))} kr</b><small class="${cls(p.day)}">${p.day>0?'+':p.day<0?'−':''}${nf0.format(Math.abs(Math.round(p.day||0)))} kr i dag</small>`)}catch(e){}}
  if(show.has('market')){try{const q=await (await fetch('/api/quote?s=OSEBX.OL')).json();if(q&&q.price!=null)h+=row('OSEBX',`<b>${nf0.format(q.price)}</b><small class="${cls(q.pct)}">${pct(q.pct)}</small>`)}catch(e){}}
  if(show.has('calendar')){try{const c=await (await fetch('/api/calendar')).json(),n=(c||[])[0];if(n)h+=row('Kommer',`<small>${esc(new Date(n.date+'T12:00:00').toLocaleDateString('nb-NO',{day:'numeric',month:'short'}))}: ${esc(n.title)}</small>`)}catch(e){}}
  $('extra').innerHTML=h;
  $('top').hidden=!show.has('top');
  if(show.has('top')){try{const t=await (await fetch('/api/top')).json(),ol=$('top');ol.textContent='';
    if(!t.length)ol.innerHTML='<li class="empty">Ingen store saker siste døgn.</li>';
    for(const e of t.slice(0,3)){const li=document.createElement('li'),b=document.createElement('button');b.innerHTML=`<span>${esc(e.title)}</span><small>${e.srcs>1?e.srcs+' kilder':'1 kilde'}</small>`;
      b.onclick=()=>window.nk&&window.nk.openItem(e.id);li.append(b);ol.append(li)}}catch(e){$('foot').textContent='Fikk ikke kontakt med nyhetsmotoren.';return}}
  $('foot').textContent='Oppdatert '+tfmt.format(new Date())}
$('x').onclick=()=>window.nk&&window.nk.widget('close');
$('pin').onclick=async()=>{const on=$('pin').getAttribute('aria-pressed')!=='true';$('pin').setAttribute('aria-pressed',on);
  if(window.nk)window.nk.widgetTop(on);try{await fetch('/api/settings',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({widgetOnTop:on})})}catch(e){}};
load();
try{const es2=new EventSource('/api/stream');es2.addEventListener('settings',()=>setTimeout(load,300))}catch(e){}setInterval(load,60e3);
try{const es=new EventSource('/api/stream');es.addEventListener('update',()=>setTimeout(load,1500))}catch(e){}
</script>
</body>
</html>
